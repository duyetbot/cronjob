# Auto invite @duyet for every new project created in this account.
# This workflow uses GitHub Script to interact with the GitHub API.
# Reference: https://octokit.github.io/rest.js

name: Auto Invite @duyet

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 * * * *" # Run hourly
  workflow_dispatch: # Allow manual triggering

# Prevent concurrent runs of this workflow
concurrency:
  group: auto-invite-duyet
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  repository-projects: read

jobs:
  auto_invite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run auto-invite script
        uses: actions/github-script@v7
        env:
          USER_NAME: duyet
          # Uncomment to enable debug logging:
          # DEBUG: true
        with:
          github-token: ${{ secrets.TOKEN }}
          script: |
            const script = require('./scripts/auto-invite-duyet.js')
            await script({github, context})
