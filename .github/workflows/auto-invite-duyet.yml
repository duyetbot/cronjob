# Auto invite @duyet for every new project created in this account.
# This workflow uses GitHub Script and Bun to run TypeScript directly.
# Reference: https://octokit.github.io/rest.js

name: Auto Invite @duyet

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: "0 * * * *" # Run hourly
  workflow_dispatch: # Allow manual triggering

# Prevent concurrent runs of this workflow
concurrency:
  group: auto-invite-duyet
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  repository-projects: read

jobs:
  auto_invite:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run auto-invite script with Bun
        env:
          USER_NAME: duyet
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          # Uncomment to enable debug logging:
          # DEBUG: true
        run: |
          bun run scripts/auto-invite-duyet-wrapper.ts
